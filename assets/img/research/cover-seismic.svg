<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Facade fall-zone risk bands projected onto a sidewalk">
  <rect width="640" height="400" fill="#f2f1ee"></rect>

  <!-- ground line -->
  <line x1="0" y1="300" x2="640" y2="300" stroke="#cfcdc8" stroke-width="1.5"></line>

  <!-- building facade with window grid -->
  <rect x="60" y="70" width="150" height="230" fill="#e7e5df" stroke="#2a2a30" stroke-width="1.5"></rect>
  <g fill="none" stroke="#9a9994" stroke-width="1.4">
    <rect x="80" y="92" width="34" height="26"></rect>
    <rect x="126" y="92" width="34" height="26"></rect>
    <rect x="172" y="92" width="26" height="26"></rect>
    <rect x="80" y="132" width="34" height="26"></rect>
    <rect x="126" y="132" width="34" height="26"></rect>
    <rect x="172" y="132" width="26" height="26"></rect>
    <rect x="80" y="172" width="34" height="26"></rect>
    <rect x="126" y="172" width="34" height="26"></rect>
    <rect x="172" y="172" width="26" height="26"></rect>
    <rect x="80" y="212" width="34" height="26"></rect>
    <rect x="126" y="212" width="34" height="26"></rect>
    <rect x="172" y="212" width="26" height="26"></rect>
  </g>

  <!-- fall-zone bands radiating from facade edge onto the sidewalk (dark = high risk, near) -->
  <g>
    <rect x="210" y="300" width="70" height="42" fill="#33333a"></rect>
    <rect x="280" y="300" width="70" height="42" fill="#6f6e6b"></rect>
    <rect x="350" y="300" width="70" height="42" fill="#9a9994"></rect>
    <rect x="420" y="300" width="70" height="42" fill="#bfbeb8"></rect>
    <rect x="490" y="300" width="80" height="42" fill="#dcdad4"></rect>
  </g>

  <!-- falling debris arc -->
  <path d="M205 96 Q250 150 300 300" fill="none" stroke="#2a2a30" stroke-width="1.4" stroke-dasharray="3 6"></path>
  <circle cx="205" cy="96" r="4.5" fill="#2a2a30"></circle>

  <!-- pedestrian in the safer (far) zone -->
  <g fill="#2a2a30" transform="translate(528,286)">
    <circle cx="0" cy="-6" r="5"></circle>
    <rect x="-3.5" y="0" width="7" height="16"></rect>
  </g>
</svg>
