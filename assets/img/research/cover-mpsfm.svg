<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sparse structure-from-motion point cloud with a camera trajectory">
  <defs>
    <pattern id="sfmDot" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#5a5960"></circle></pattern>
  </defs>
  <rect width="640" height="400" fill="#f2f1ee"></rect>

  <!-- sparse structure blobs (point cloud) -->
  <rect x="70" y="70" width="150" height="120" fill="url(#sfmDot)" opacity="0.9"></rect>
  <rect x="250" y="52" width="120" height="96" fill="url(#sfmDot)" opacity="0.9"></rect>
  <rect x="430" y="78" width="150" height="120" fill="url(#sfmDot)" opacity="0.9"></rect>

  <!-- scattered floaters -->
  <g fill="#a8a69f">
    <circle cx="120" cy="220" r="2"></circle><circle cx="180" cy="240" r="2"></circle><circle cx="240" cy="212" r="2"></circle>
    <circle cx="300" cy="236" r="2"></circle><circle cx="360" cy="214" r="2"></circle><circle cx="420" cy="238" r="2"></circle>
    <circle cx="480" cy="220" r="2"></circle><circle cx="150" cy="120" r="2"></circle><circle cx="520" cy="140" r="2"></circle>
    <circle cx="405" cy="150" r="2"></circle><circle cx="95" cy="180" r="2"></circle><circle cx="565" cy="180" r="2"></circle>
  </g>

  <!-- camera trajectory -->
  <path d="M80 320 C 200 300, 200 270, 320 276 S 470 300, 560 292" fill="none" stroke="#9a9994" stroke-width="2.2"></path>

  <!-- camera frustums along the path -->
  <g stroke="#2a2a30" stroke-width="1.5" fill="#f2f1ee">
    <g transform="translate(80,320)"><circle r="4" fill="#2a2a30" stroke="none"></circle><path d="M0 0 L-16 -12 M0 0 L-16 8" fill="none"></path></g>
    <g transform="translate(200,286)"><circle r="4" fill="#2a2a30" stroke="none"></circle><path d="M0 0 L-14 -13 M0 0 L-16 4" fill="none"></path></g>
    <g transform="translate(320,276)"><circle r="4" fill="#2a2a30" stroke="none"></circle><path d="M0 0 L-8 -15 M0 0 L8 -15" fill="none"></path></g>
    <g transform="translate(440,286)"><circle r="4" fill="#2a2a30" stroke="none"></circle><path d="M0 0 L14 -13 M0 0 L16 4" fill="none"></path></g>
    <g transform="translate(560,292)"><circle r="4" fill="#2a2a30" stroke="none"></circle><path d="M0 0 L16 -12 M0 0 L16 8" fill="none"></path></g>
  </g>

  <text x="80" y="356" font-family="'Inter',sans-serif" font-size="12" fill="#6f6e6b">sparse cloud &#183; chained camera poses</text>
</svg>
